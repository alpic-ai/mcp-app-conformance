<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCP Apps · Conformance Grid</title>
<style>
  :root{--bg:#0d0f14;--panel:#151921;--ink:#e7ecf3;--muted:#97a3b6;--line:#252c38;
    --accent:#6ea8fe;--pass:#7ee0a0;--fail:#f08a8a;--timeout:#f0b86e;--notrun:#5b6573;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .wrap{max-width:1000px;margin:0 auto;padding:40px 24px}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 28px;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left}
  th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  th.host{text-align:center}
  td.test{max-width:420px}
  td.test .id{font-family:var(--mono);color:var(--accent);font-size:12px}
  td.test .nm{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  td.cell{text-align:center;font-family:var(--mono);font-size:16px}
  .pass{color:var(--pass)}.fail{color:var(--fail)}.timeout{color:var(--timeout)}.notrun{color:var(--notrun)}
  .legend{margin-top:22px;color:var(--muted);font-size:12px;font-family:var(--mono)}
  .legend span{margin-right:16px}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  .clause{font-family:var(--mono);font-size:10px;color:var(--muted)}
  td.test .caveat{color:var(--timeout);font-size:11px;margin-top:4px;line-height:1.4;max-width:420px}
  .vantage{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);font-size:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>MCP Apps · Conformance Grid</h1>
  <p class="sub">Same test server, every host as a column.</p>
  <div id="grid"></div>
  <div class="legend">
    <span class="pass">✅ PASS</span><span class="fail">✕ FAIL</span><span class="timeout">⏱ TIMEOUT</span><span class="notrun">· NOTRUN</span>
  </div>
</div>
<script type="module">
const SYM = { PASS:["✅","pass"], FAIL:["✕","fail"], TIMEOUT:["⏱","timeout"], NOTRUN:["·","notrun"] };

async function load() {
  let runs = [];
  try { runs = await (await fetch("/results")).json(); } catch {}
  const gridEl = document.getElementById("grid");
  if (!runs.length) { gridEl.innerHTML = '<div class="empty">No results yet. Run the suite inside a host, then refresh.</div>'; return; }

  // Latest run per host = that host's column.
  const hosts = [];
  const byHost = new Map();
  for (const run of runs) { if (!byHost.has(run.host)) { byHost.set(run.host, run); hosts.push(run.host); } }

  // Union of all test ids (stable order from the first run that has them).
  const tests = new Map();
  for (const h of hosts) for (const r of byHost.get(h).results) if (!tests.has(r.id)) tests.set(r.id, { id:r.id, name:r.name, clause:r.clause, vantage:r.vantage, caveat:r.caveat });

  const esc = (s) => (s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]);
  const head = `<tr><th>Test</th><th class="clause">Clause</th>${hosts.map(h=>`<th class="host">${h}</th>`).join("")}</tr>`;
  const rows = [...tests.values()].map(t => {
    const cells = hosts.map(h => {
      const r = byHost.get(h).results.find(x => x.id === t.id);
      const [sym, cls] = SYM[r?.status ?? "NOTRUN"] ?? SYM.NOTRUN;
      return `<td class="cell ${cls}" title="${esc(r?.message)}">${sym}</td>`;
    }).join("");
    const caveat = t.caveat ? `<div class="caveat">⚠️ ${esc(t.caveat)}</div>` : "";
    return `<tr><td class="test"><span class="id">${esc(t.id)}</span><span class="nm">${esc(t.name)}</span>${caveat}</td><td class="clause">${esc(t.clause)}${t.vantage ? `<span class="vantage">${esc(t.vantage)}</span>` : ""}</td>${cells}</tr>`;
  }).join("");
  gridEl.innerHTML = `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}
load();
</script>
</body>
</html>
